services:
  magpie:
    container_name: magpie
    image: ghcr.io/yellowumbrelladev/magpie
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
      - DB_HOST=db
      - DB_NAME=magpie
      - DB_USER=magpie
      - DB_PASSWORD=magpie
      - DB_PORT=5432
    volumes:
      # Uploaded images. The database lives in Postgres.
      - ./media:/magpie/db/media
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    container_name: magpie-db
    environment:
      - POSTGRES_DB=magpie
      - POSTGRES_USER=magpie
      - POSTGRES_PASSWORD=magpie
    volumes:
      - ./db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: magpie-redis
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
